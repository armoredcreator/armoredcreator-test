name: ArmoredCreator Test

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Architecture doctor
        run: python tools/doctor.py
      - name: Package laboratory source
        shell: bash
        run: |
          zip -r ArmoredCreator-test-e2e.zip . -x ".git/*" -x "__pycache__/*" -x "*/__pycache__/*" -x "*.pyc" -x "storage/*" -x "credentials/*"
      - name: Upload laboratory package
        uses: actions/upload-artifact@v4
        with:
          name: ArmoredCreator-test-e2e
          path: ArmoredCreator-test-e2e.zip
          if-no-files-found: error
